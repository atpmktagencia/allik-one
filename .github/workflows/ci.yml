name: Inventory checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: allik
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: allik_inventory_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://allik:synthetic-ci-only@localhost:5432/allik_inventory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:preview-guard
      - run: bun run lint
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:integration
